<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily check-in · Study Buddy</title>
<meta name="description" content="Set today's target and track your streak">
<meta name="theme-color" content="#3730a3">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233730a3'/%3E%3Cpath d='M7 10c3-1.500 6-1.500 9 1v11c-3-2.500-6-2.500-9-1zM25 10c-3-1.500-6-1.500-9 1v11c3-2.500 6-2.500 9-1z' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="checkin" data-auth="required">
<a class="skip-link" href="#main">Skip to content</a>
<div id="shell-header"></div>
<main id="main" class="page" tabindex="-1">
<div class="container">
<div class="page-head"><h1>Daily check-in</h1><p id="today-date"></p></div>
<p class="lock-note" style="margin-bottom:16px"><span id="lock-i"></span> Private by default. Only you can see this page.</p>
<div class="grid grid-2">
  <div class="stack">
    <div class="card"><div id="today-progress"></div></div>
    <div class="card"><div class="card-title"><h2>Today's targets</h2></div>
      <p class="hint">Set what you want to do today. Leave a target at 0 to skip it.</p>
      <form id="checkin-form" novalidate></form>
      <div class="row mt-sm"><button id="save-btn" class="btn btn-primary" type="button">Save now</button><span id="save-state" class="save-state" role="status"></span></div>
    </div>
    <div class="card"><div class="card-title"><h2>Private note</h2></div>
      <div class="field mb-0"><label for="note">Anything to remember about today? <span class="hint">(only you can read this)</span></label>
        <textarea id="note" placeholder="e.g. Revise Rotational Motion tomorrow"></textarea><div class="counter" id="note-count" aria-hidden="true">0/500</div></div></div>
  </div>
  <div class="stack">
    <div class="card" id="streak-box"></div>
    <div class="card"><div class="card-title"><h2>Last 7 days</h2></div><div class="week-bars" id="week-bars" role="img" aria-label="Completion percentage for the last 7 days"></div></div>
    <div class="card"><div class="card-title"><h2>Weekly summary</h2></div><div id="week-summary"></div></div>
  </div>
</div>
<script type="module">import { icon } from './js/ui.js'; document.getElementById('lock-i').innerHTML = icon('lock', 16);</script>
</div>
</main>
<div id="shell-tabbar"></div>
<script type="module" src="js/checkin.js"></script>
</body>
</html>
