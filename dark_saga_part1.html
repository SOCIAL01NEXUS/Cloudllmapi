/* ---------- utils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
const hs=(i,k)=>{const s=Math.sin(i*127.1+k*311.7)*43758.5453;return s-Math.floor(s)};
function srng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

/* ---------- audio (procedural) ---------- */
let AC=null,muted=false,noiseBuf=null,droneG=null;
function initAudio(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      const o=AC.createOscillator(),o2=AC.createOscillator();droneG=AC.createGain();
      o.type='sine';o.frequency.value=47;o2.type='triangle';o2.frequency.value=71;
      droneG.gain.value=muted?0:.03;o.connect(droneG);o2.connect(droneG);droneG.connect(AC.destination);o.start();o2.start();
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function setMute(m){muted=m;if(droneG)droneG.gain.value=m?0:.03}
function tone(f,d,type,v,sl){
  if(!AC||muted)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function nz(d,v,fq){
  if(!AC||muted||!noiseBuf)return;
  try{const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=fq||1200;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.4);s.stop(t+d+.02);}catch(e){}
}

const keys={},touches=new Map(),edge={jump:0,atk:0,sp:0,tap:0,pause:0};
function BT(){return[

  {n:'atk',x:W-100,y:H-100,r:62,lb:'ATK'},{n:'jump',x:W-245,y:H-78,r:50,lb:'JUMP'},{n:'sp',x:W-222,y:H-200,r:48,lb:'SP'}];}
function lpos(e){return{x:(e.clientX-OX)/S,y:(e.clientY-OY)/S}}
function hitBtn(p){for(const b of BT()){const dx=p.x-b.x,dy=p.y-b.y;if(dx*dx+dy*dy<(b.r*1.18)*(b.r*1.18))return b.n}return null}
function held(n){for(const t of touches.values())if(t.btn===n)return true;return false}
function fire(n){if(n==='jump')edge.jump=1;else if(n==='atk')edge.atk=1;else if(n==='sp')edge.sp=1}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=lpos(e),t={x:p.x,y:p.y,btn:null};touches.set(e.pointerId,t);
  if(state==='play'){
    if(Math.hypot(p.x-(W-34),p.y-34)<30){edge.pause=1;return}
    t.btn=hitBtn(p);if(t.btn)fire(t.btn);
  }else{
    let used=false;for(let i=ui.length-1;i>=0;i--){const b=ui[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();used=true;break}}
    if(!used)edge.tap=1;
  }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();const t=touches.get(e.pointerId);if(!t)return;const p=lpos(e);t.x=p.x;t.y=p.y;
  if(state==='play'){const nb=hitBtn(p);if(nb!==t.btn){t.btn=nb;if(nb&&nb!=='l'&&nb!=='r')fire(nb)}}
},{passive:false});
const upH=e=>{touches.delete(e.pointerId)};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);cv.addEventListener('lostpointercapture',upH);
cv.addEventListener('contextmenu',e=>e.preventDefault());

  initAudio();if(keys[e.code])return;keys[e.code]=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){edge.jump=1;edge.tap=1}
  if(e.code==='KeyJ'||e.code==='KeyZ'){edge.atk=1}
  if(e.code==='KeyK'||e.code==='KeyX'){edge.sp=1}
  if(e.code==='Enter')edge.tap=1;
  if(e.code==='Escape'||e.code==='KeyP')edge.pause=1;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});

function floorWaves(i){
  if(i===10)return[['guardian',SH,SH],[SH,SH,T,T,G]];
  const r=srng(i*7919+13),pool=i<=3?[Z,Z,R,T]:i<=6?[Z,R,T,G,SH]:[R,T,G,SH,SH,M],nW=i<=3?2:3,out=[];
  for(let w=0;w<nW;w++){const n=Math.min(6,2+Math.ceil(i/2)+(w===nW-1?1:0)),a=[];let mu=0;
    for(let k=0;k<n;k++){let t=pool[Math.floor(r()*pool.length)];if(t===M){if(mu>=1)t=T;else mu++}a.push(t)}out.push(a)}
  return out;
}

function loadChapter(i,checkpoint){
  chIdx=i;const D=CH[i];L={D,done:{},arena:null,theme:D.theme,fin:false};
  enemies=[];bullets=[];parts=[];pickups=[];ghosts=[];banner=null;CUT=null;
  P=mkPlayer(D.hero);
  if(checkpoint){P.x=checkpoint.x;L.done=Object.assign({},checkpoint.done);P.ammo=Math.max(checkpoint.ammo,10);L.theme=checkpoint.theme}
  child=D.child?{x:P.x-70,y:GY,face:1,t:0,wk:0}:null;
  ally=D.ally?mkAlly(D.ally,P.x-110):null;
  cam.x=Math.max(0,P.x-W*.4);cp={x:P.x,done:Object.assign({},L.done),ammo:P.ammo,theme:L.theme};
  if(checkpoint){state='play';hintT=0}else{state='card';cardT=0}
}
function setCP(){cp={x:P.x,done:Object.assign({},L.done),ammo:P.ammo,theme:L.theme}}

function startCut(lines,after){state='cut';CUT={lines,i:0,n:0,after};const f=lines[0]&&lines[0][2];if(f)doFx(f)}

function cutAdvance(){
  if(!CUT)return;const l=CUT.lines[CUT.i];
  if(CUT.n<l[1].length){CUT.n=l[1].length;return}
  CUT.i++;CUT.n=0;
  if(CUT.i>=CUT.lines.length){const a=CUT.after;CUT=null;state='play';if(a)a()}else{const f=CUT.lines[CUT.i][2];if(f)doFx(f)}
}
function runEv(ev){
  switch(ev.t){
    case'sp':for(const[t,dx]of ev.e)spawn(t,ev.x+dx);break;
    case'pk':pickups.push({x:ev.x+ev.dx,k:ev.k,t:0});break;
    case'cut':startCut(ev.l,setCP);break;
    case'theme':L.theme=ev.th;flashW=.8;break;
    case'fl':showBanner(ev.txt,2.6);break;
    case'lock':startArena(ev);break;
    case'ls':startCut(ev.pre,()=>{ally=null;child=null;startArena({x:ev.x,ls:true,kills:ev.kills,post:ev.post})});break;
  }
}

  L.arena={cx:ax,left:ax-W*.46,right:ax+W*.46,dc:0,w:(ev.w||[]).map(a=>a.slice()),wi:0,kills:0,opts:ev.opts||{},ls:!!ev.ls,lsKills:ev.kills||0,post:ev.post,after:ev.after,spT:0,fl:ev.fl};
  if(ev.ls){P.ls=true;showBanner('BETI KO NIKALNE DO! Kill: 0/'+ev.kills,3)}

}
function arenaSpawn(t){
  const A=L.arena;

}
function aliveCount(){let n=0;for(const e of enemies)if(!e.dead)n++;return n}
function updArena(dt){
  const A=L.arena;if(!A)return;const alive=aliveCount();
  if(A.ls){
    A.spT-=dt;
    if(alive<5&&A.spT<=0){const r=Math.random();arenaSpawn(r<.35?T_:r<.6?G:r<.8?Z:R);A.spT=1.1}
    if(A.kills>=A.lsKills){finishLS()}return;
  }
  if(A.opts.heroEnter&&!A.heroIn&&A.wi>=A.opts.heroEnter){A.heroIn=1;startCut(HERO_LINES,()=>{ally=mkAlly('hero',P.x-120);flashW=1});return}
  if(A.opts.sac&&!A.sacDone&&A.wi>=A.w.length&&alive<=2&&ally){A.sacDone=1;startCut(SAC_LINES,()=>{ally=null;P.rage=true;P.hp=Math.min(P.max,P.hp+60);A.w.push([Z,Z,R,R,SH,SH]);showBanner('RAGE MODE!',2.4);shake=20});return}
  if(A.opts.uncleDie&&!A.uDone){for(const e of enemies)if(!e.dead&&e.t==='megamutant'&&e.hp<=e.max*.5){A.uDone=1;startCut(UNCLE_DIE,()=>{ally=null;e.rage=true;showBanner('MEGA MUTANT GUSSE MEIN!',2.4)});return}}
  if(A.wi<A.w.length&&alive<=(A.wi===0?0:1)){const w=A.w[A.wi++];w.forEach(t=>arenaSpawn(t));if(A.w.length>1)showBanner('WAVE '+A.wi+'/'+A.w.length,1.4);}
  if(A.wi>=A.w.length&&alive===0){endArena()}
}

/* ---------- combat ---------- */
function hurtP(dmg,dir,kb){
  const p=P;if(p.inv>0||p.dead||p.dashT>0)return false;
  if(p.ls)dmg*=.6;p.hp-=dmg;p.inv=.55;p.flash=.25;p.kbx=dir*(kb||160);p.stun=.1;shake=Math.max(shake,7);freeze=.04;sfx.hurt();blood(p.x,p.y-55,8,dir);p.lastHurt=0;
  if(p.hp<=0){p.hp=0;killPlayer()}return true;
}
function killPlayer(){
  if(L.arena&&L.arena.ls){finishLS();return}
  P.dead=true;P.fallT=0;goT=0;state='over';sfx.die();shake=14;
}
function hitEnemy(e,dmg,dir,kb,heavy){
  if(e.dead)return;if(P&&P.rage)dmg*=1.4;
  e.hp-=dmg;e.flash=.1;const T=e.T;e.kbx+=dir*(kb||100)*(T.kbr||1);
  if(!T.boss&&!T.armor){e.stun=.18;if(e.state==='wind'||e.state==='aim'){e.state='walk'}}
  else if(heavy&&!T.boss){e.stun=.2;if(e.state==='wind')e.state='walk'}
  freeze=Math.max(freeze,heavy?.07:.045);sfx.hit();blood(e.x,e.y-e.h*.6,heavy?10:6,dir,T.ghostly?'#400':null);
  if(e.hp<=0)killEnemy(e,dir);
}
function killEnemy(e,dir){
  e.dead=true;e.dt=0;e.kbx=dir*140;const T=e.T;if(L.arena)L.arena.kills++;
  if(L.arena&&L.arena.ls)showBanner('BETI KO NIKALNE DO!  Kill: '+Math.min(L.arena.kills,L.arena.lsKills)+'/'+L.arena.lsKills,1.2);
  blood(e.x,e.y-e.h*.5,T.boss?30:14,dir);if(T.boss){freeze=.2;shake=22;sfx.roar()}
  if(!T.dummy){const r=Math.random();if(r<.1&&(P.kind==='father'))pickups.push({x:e.x,k:'ammo',t:0});else if(r<.17)pickups.push({x:e.x,k:'med',t:0})}
}
function startAttack(){
  const p=P;p.hitL=[];sfx.swing();
  if(p.kind==='father'){p.atkDur=.36;p.reach=80;p.sdir=1;p.dmg=26*(p.ls?1.5:1);p.kb=130;p.heavy=false;p.x+=p.face*8}
  else{
    if(p.comboT>0&&p.combo<3)p.combo++;else p.combo=1;
    const c=p.combo;p.atkDur=[.26,.26,.4][c-1];p.reach=[88,88,108][c-1];p.dmg=[22,22,40][c-1];p.kb=[140,140,380][c-1];p.sdir=c===2?-1:1;p.heavy=c===3;p.comboT=.6;p.x+=p.face*(c===3?18:10);
  }
  p.atkT=p.atkDur;
}
function checkMelee(){
  const p=P,prog=1-p.atkT/p.atkDur;if(prog<.3||prog>.78)return;
  const xa=p.face>0?p.x-14:p.x-p.reach,xb=p.face>0?p.x+p.reach:p.x+14;
  for(const e of enemies){
    if(e.dead||p.hitL.includes(e))continue;
    if(e.x+e.w/2<xa||e.x-e.w/2>xb||Math.abs(e.y-p.y)>75)continue;
    p.hitL.push(e);hitEnemy(e,p.dmg,p.face,p.kb,p.heavy);
  }
}
function shoot(){
  const p=P;if(p.gunCd>0)return;
  if(p.ammo<=0){showBanner('Goli khatam!',1);return}
  p.ammo--;p.gunT=.3;p.gunCd=.34;p.kbx-=p.face*60;sfx.shot();shake=Math.max(shake,3);
  bullets.push({x:p.x+p.face*34,y:p.y-60,vx:p.face*950,team:'p',dmg:32*(p.ls?1.5:1),life:1.2});
  sparks(p.x+p.face*40,p.y-60,5,'#ffe9a0');
}
function dash(){
  const p=P;if(p.dashCd>0||p.dashT>0)return;
  p.dashT=.2;p.dashCd=2.4;p.inv=.35;p.dashHit=[];sfx.dash();

function dashHit(){
  const p=P;for(const e of enemies){if(e.dead||p.dashHit.includes(e))continue;
    if(Math.abs(e.x-p.x)<e.w/2+28&&Math.abs(e.y-p.y)<80){p.dashHit.push(e);hitEnemy(e,38,p.face,220,true)}}
}

/* ---------- updates ---------- */
function updPlayer(dt){
  const p=P,I=inp;p.t+=dt;p.lastHurt+=dt;
  for(const k of['inv','flash','stun','gunT','gunCd','dashCd','buf'])if(p[k]>0)p[k]-=dt;
  if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)p.combo=0}
  if(edge.atk||I.atk)p.buf=.2;
  const spd=p.kind==='father'?235:275,ax=(I.r?1:0)-(I.l?1:0);
  if(p.dashT>0){
    p.dashT-=dt;p.x+=p.face*1000*dt;ghosts.push({x:p.x,y:p.y,face:p.face,life:.28,max:.28});dashHit();
    if(p.dashT<=0)p.inv=Math.max(p.inv,.15);
  }else{
    p.vx=0;
    if(p.stun<=0){const m=p.atkT>0?.3:1;p.vx=ax*spd*m;if(ax&&p.atkT<=0)p.face=ax}
    p.x+=(p.vx+p.kbx)*dt;
  }
  p.kbx*=Math.max(0,1-dt*8);
  if(edge.jump&&p.onG&&p.stun<=0&&p.dashT<=0){p.vy=-650;p.onG=false}
  p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>=GY){p.y=GY;p.vy=0;p.onG=true}
  p.wk=(Math.abs(p.vx)>10&&p.onG)?1:0;
  if(p.atkT>0){p.atkT-=dt;checkMelee()}
  if(p.buf>0&&p.atkT<=.04&&p.stun<=0&&p.dashT<=0){startAttack();p.buf=0}
  if(edge.sp&&p.stun<=0){if(p.kind==='father')shoot();else dash()}
  if(p.kind==='girl'&&p.hp<p.max&&p.lastHurt>3.5)p.hp=Math.min(p.max,p.hp+(p.rage?10:4)*dt);
  // bounds
  const A=L.arena;
  const lo=A?A.left+10:cam.x+30,hi=A?A.right-10:L.D.len-40;
  p.x=clamp(p.x,lo,hi);
}
function updChild(dt){
  if(!child)return;child.t+=dt;const want=P.x-P.face*62,d=want-child.x;
  if(Math.abs(d)>14){child.x+=sgn(d)*Math.min(Math.abs(d),(Math.abs(d)>150?330:250)*dt);child.wk=1;child.face=sgn(d)}else{child.wk=0;child.face=P.face}
}
function updAlly(dt){
  const a=ally;if(!a)return;a.t+=dt;a.cd-=dt;if(a.fl>0)a.fl-=dt;if(a.atkA!=null){a.atkA+=dt/.25;if(a.atkA>=1)a.atkA=null}
  let tg=null,bd=1e9;for(const e of enemies){if(e.dead)continue;const d=Math.abs(e.x-a.x);if(d<bd){bd=d;tg=e}}
  const behind=P.x-P.face*(a.type==='uncle'?125:95);
  if(a.type==='uncle'){
    if(tg&&bd<520){a.face=sgn(tg.x-a.x);if(a.cd<=0){a.cd=.75;bullets.push({x:a.x+a.face*34,y:a.y-60,vx:a.face*850,team:'p',dmg:11,life:1.1});a.fl=.1;tone(150,.08,'square',.03,-60)}}
    else a.face=P.face;
    const d=behind-a.x;if(Math.abs(d)>35){a.x+=sgn(d)*Math.min(Math.abs(d),240*dt);a.wk=1}else a.wk=0;
  }else{
    if(tg&&bd<620&&a.cd<=0){
      const dir=sgn(tg.x-a.x);a.face=dir;const nx=tg.x-dir*55;
      for(let k=0;k<8;k++)ghosts.push({x:lerp(a.x,nx,k/8),y:a.y,face:dir,life:.22,max:.22,c:'hero'});
      a.x=nx;a.cd=.6;a.atkA=0;sfx.dash();

      sparks(tg.x,tg.y-50,10,'#9ff0ff');
    }else if(!tg||bd>=620){
      a.face=P.face;const d=behind-a.x;if(Math.abs(d)>35){a.x+=sgn(d)*Math.min(Math.abs(d),300*dt);a.wk=1}else a.wk=0;
    }else a.wk=0;
  }
}
function strike(e){

function updEnemy(e,dt){
  const T=e.T;

  e.tt+=dt;if(e.flash>0)e.flash-=dt;if(e.fm>0)e.fm-=dt;e.cd-=dt;e.chCd-=dt;

  const AR=L&&L.arena;if(AR){if(e.x>AR.left-20&&e.x<AR.right+20)e.in=true;if(e.in)e.x=clamp(e.x,AR.left-20,AR.right+20)}
  if(T.passive)return;
  if(e.stun>0){e.stun-=dt;return}
  const dx=P.x-e.x,ad=Math.abs(dx),rg=e.rage?1.45:1;e.mv=false;
  switch(e.state){
    case'wind':e.wt-=dt;if(e.wt<=0){strike(e);e.state='rec';e.rt=T.rec||.35}return;
    case'rec':e.rt-=dt;if(e.rt<=0)e.state='walk';return;
    case'aim':e.wt-=dt;if(e.wt<=0){fireE(e);e.state='rec';e.rt=.5}return;
    case'cwind':e.wt-=dt;if(e.wt<=0){e.state='charge';e.ct=.7;e.chHit=false;sfx.roar()}return;
    case'charge':
      e.x+=e.face*T.chSpd*dt;e.mv=true;e.ct-=dt;
      if(Math.abs(P.x-e.x)<48&&P.y>GY-55&&!e.chHit){if(hurtP(T.dmg,e.face,340))e.chHit=true}
      if(e.ct<=0){e.state='rec';e.rt=.7;e.chCd=rnd(3.5,6)}return;
  }
  e.face=dx>=0?1:-1;
  if(T.ranged){
    let want=ad<250?-1:(ad>420?1:0);if(AR&&!e.in)want=1;e.x+=e.face*want*T.spd*dt;e.mv=want!==0;
    if(e.cd<=0&&ad<600){e.state='aim';e.wt=.45;e.cd=rnd(1.7,2.5)}return;
  }
  if(T.charge&&e.chCd<=0&&ad>230&&ad<650){e.state='cwind';e.wt=.7/rg;return}
  if(ad>T.rng*.85){e.x+=e.face*T.spd*e.sv*rg*dt;e.mv=true}
  else if(e.cd<=0){e.state='wind';e.wt=(T.wind||.5)/rg;e.cd=(T.cdn||1)+rnd(0,.6)}
}
function updBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.life-=dt;let rem=b.life<=0;
    if(!rem){
      if(b.team==='p'){for(const e of enemies){if(e.dead)continue;if(Math.abs(b.x-e.x)<e.w/2+6&&b.y>e.y-e.h&&b.y<e.y){hitEnemy(e,b.dmg,sgn(b.vx),90);rem=true;break}}}
      else if(!P.dead&&Math.abs(b.x-P.x)<18&&b.y>P.y-90&&b.y<P.y){hurtP(b.dmg,sgn(b.vx),120);rem=true}
    }
    if(rem)bullets.splice(i,1);
  }
}
function updPickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const k=pickups[i];k.t+=dt;
    if(Math.abs(P.x-k.x)<36&&P.y>GY-60){
      if(k.k==='med'){P.hp=Math.min(P.max,P.hp+45);showBanner('+ Medkit',1.2)}else{P.ammo=Math.min(40,P.ammo+8);showBanner('+ Goliyaan',1.2)}
      sfx.pick();pickups.splice(i,1);
    }
  }
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>GY+8&&p.g>0){p.y=GY+8;p.vy=0;p.vx*=.8}}
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].life-=dt;if(ghosts[i].life<=0)ghosts.splice(i,1)}
}
function updatePlay(dt){
  inp=getInp();
  updPlayer(dt);updChild(dt);updAlly(dt);
  for(const e of enemies)updEnemy(e,dt);
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;const d=a.x-b.x;if(Math.abs(d)<26&&a.state==='walk'&&b.state==='walk'){const s=(d>=0?1:-1)*35*dt;a.x+=s;b.x-=s}}}
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&enemies[i].dt>1.8)enemies.splice(i,1);
  updBullets(dt);updPickups(dt);updParts(dt);updArena(dt);
  if(state!=='play')return;
  const D=L.D;
  if(!L.arena){for(const ev of D.ev){if(L.done[ev.id])continue;if(P.x>=ev.x){L.done[ev.id]=1;runEv(ev);if(state!=='play'||L.arena)break}}}
  // camera
  const A=L.arena;let tx=A?A.cx-W/2:P.x-W*.4+P.face*40;
  tx=clamp(tx,0,Math.max(0,D.len-W));cam.x=lerp(cam.x,tx,1-Math.pow(.0005,dt));if(A)cam.x=lerp(cam.x,tx,.12);
  if(!L.arena&&!L.fin&&P.x>=D.len-60&&state==='play'){L.fin=true;finishChapter()}
  if(hintT>0)hintT-=dt;
}
function update(dt){
  time+=dt;if(shake>0)shake=Math.max(0,shake-dt*40);if(flashW>0)flashW=Math.max(0,flashW-dt*1.6);
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
  if(IH>IW){edge.jump=edge.atk=edge.sp=edge.tap=edge.pause=0;return}
  if(P&&P.dead)P.fallT+=dt;
  const th=L?L.theme:'ruins';if((th==='outside'||th==='dark')&&state!=='pause'&&Math.random()<dt*.14)flashW=.85;
  switch(state){
    case'title':titleT+=dt;cam.x+=60*dt;break;
    case'card':cardT+=dt;if(edge.tap||cardT>3.6){CUT=null;startCut(L.D.intro,()=>{hintT=8;showBanner(L.D.title,2.4)})}break;
    case'cut':if(CUT){CUT.n+=dt*55;if(edge.tap||edge.atk)cutAdvance()}updParts(dt);break;
    case'play':
      if(edge.pause){state='pause';break}
      if(freeze>0){freeze-=dt;break}
      updatePlay(dt);break;
    case'over':goT+=dt;updParts(dt);for(const e of enemies)if(e.dead)updEnemy(e,dt);break;
    case'pause':if(edge.pause){state='play'}break;
  }
  edge.jump=edge.atk=edge.sp=edge.tap=edge.pause=0;
}

function arm(sx,sy,a,col,wd){
  const e1x=sx+Math.cos(a-.35)*15,e1y=sy+Math.sin(a-.35)*15,hx=e1x+Math.cos(a+.25)*15,hy=e1y+Math.sin(a+.25)*15;

}
function weapon(w,hx,hy,a,flash,glow){

  if(w==='axe'){cx.strokeStyle='#5a3a22';cx.lineWidth=5;cx.beginPath();cx.moveTo(-8,0);cx.lineTo(38,0);cx.stroke();cx.fillStyle='#a8b0b8';cx.beginPath();cx.moveTo(28,0);cx.lineTo(30,-16);cx.lineTo(44,-13);cx.lineTo(42,6);cx.lineTo(28,4);cx.fill()}
  else if(w==='sword'||w==='blade'){
    const gc=w==='blade'?'rgba(120,230,255,.45)':'rgba(255,40,40,.4)';
    cx.strokeStyle=gc;cx.lineWidth=9;cx.beginPath();cx.moveTo(8,0);cx.lineTo(60,0);cx.stroke();
    cx.strokeStyle=w==='blade'?'#dffaff':'#e4e4ec';cx.lineWidth=3.5;cx.beginPath();cx.moveTo(6,0);cx.lineTo(60,0);cx.stroke();
    cx.strokeStyle='#3a2a22';cx.lineWidth=4;cx.beginPath();cx.moveTo(-6,0);cx.lineTo(6,0);cx.stroke();cx.beginPath();cx.moveTo(6,-7);cx.lineTo(6,7);cx.stroke();
  }
  else if(w==='rifle'){cx.strokeStyle='#1a1a1a';cx.lineWidth=5;cx.beginPath();cx.moveTo(-10,2);cx.lineTo(38,0);cx.stroke();cx.strokeStyle='#4a3a2a';cx.lineWidth=6;cx.beginPath();cx.moveTo(-12,2);cx.lineTo(4,1);cx.stroke();if(flash){cx.fillStyle='#ffe9a0';cx.beginPath();cx.arc(44,0,7,0,7);cx.fill()}}
  else if(w==='pistol'){cx.strokeStyle='#1a1a1a';cx.lineWidth=4;cx.beginPath();cx.moveTo(-2,0);cx.lineTo(18,0);cx.stroke();if(flash){cx.fillStyle='#ffe9a0';cx.beginPath();cx.arc(24,0,7,0,7);cx.fill()}}
  else if(w==='bat'){cx.strokeStyle='#6b4a2f';cx.lineWidth=6;cx.beginPath();cx.moveTo(-4,0);cx.lineTo(40,0);cx.stroke();cx.fillStyle='#bbb';cx.fillRect(30,-4,3,2);cx.fillRect(36,2,3,2)}
  cx.restore();
}
function drawHuman(o){

  cx.scale(face*sc,sc);cx.lineCap='round';cx.lineJoin='round';
  const ph=t*(o.sp||11),s1=Math.sin(ph)*wk,s2=-s1,bob=Math.abs(Math.cos(ph))*2.5*wk;
  const lean=(o.lean||0)+(o.dash?14:0),hipY=-42-bob,shY=-72-bob;const tw=o.tw||14;

  const zp=o.pose==='z';let aF,aB;
  if(o.atk!=null){const e=ease(o.atk);aF=o.sdir<0?lerp(1.1,-1.7,e):lerp(-2.1,1.1,e);aB=.9}

    const sw=k?s2:s1,fx=(k?-5:5)+sw*20,lift=Math.max(0,Math.cos(ph+(k?Math.PI:0)))*6*wk;
    cx.strokeStyle=flash?'#fff':(k?shade(c.pants):c.pants);cx.lineWidth=8;cx.beginPath();cx.moveTo(0,hipY);cx.lineTo(fx*.5+3,hipY+22);cx.lineTo(fx,-3-lift);cx.stroke();
    cx.fillStyle='#0c0c0c';cx.fillRect(fx-3,-5-lift,12,5);
  }

  cx.strokeStyle=C('top');cx.lineWidth=tw;cx.beginPath();cx.moveTo(0,hipY);cx.lineTo(lean,shY);cx.stroke();
  if(c.trim){cx.strokeStyle=c.trim;cx.lineWidth=2;cx.beginPath();cx.moveTo(-4+lean*.5,shY+10);cx.lineTo(5+lean*.5,shY+14);cx.stroke()}

    if(c.spiky){for(let k=0;k<4;k++){cx.beginPath();cx.moveTo(hx-8+k*5,hy-6);cx.lineTo(hx-6+k*5,hy-17-(k%2)*3);cx.lineTo(hx-3+k*5,hy-6);cx.fill()}}
    if(c.ponytail){cx.strokeStyle=c.hair;cx.lineWidth=5;cx.beginPath();cx.moveTo(hx-8,hy-2);cx.quadraticCurveTo(hx-20,hy+4+Math.sin(t*5)*3,hx-18+Math.sin(t*4)*3,hy+18);cx.stroke()}}
  if(c.beard){cx.fillStyle=flash?'#fff':c.hair;cx.beginPath();cx.arc(hx+2,hy+3,8,.1,Math.PI-.1);cx.fill()}
  cx.fillStyle=c.eye||'#111';if(c.eye&&!flash){cx.globalAlpha=(o.alpha==null?1:o.alpha)*.9}cx.beginPath();cx.arc(hx+5,hy-1,c.eye?2.3:1.5,0,7);cx.fill();cx.globalAlpha=o.alpha==null?1:o.alpha;
  if(c.deco==='bandana'){cx.fillStyle='#a01818';cx.fillRect(hx-9,hy-7,19,4);cx.fillRect(hx-14,hy-6,6,3)}
  if(c.deco==='mask'){cx.fillStyle='#111';cx.fillRect(hx-2,hy+1,12,7)}

function shade(h){const n=parseInt(h.slice(1),16),r=(n>>16)*.7|0,g=((n>>8)&255)*.7|0,b=(n&255)*.7|0;return'rgb('+r+','+g+','+b+')'}
function drawDummy(e){

function drawEnemy(e){

function drawPlayer(){

function layerBuildings(par,sp,minH,maxH,col,winCol,seed,baseY){

  txt('CHAPTER '+D.id,W/2,H/2-50,18,'#c03a30','center','Georgia,serif');
  txt(D.title,W/2,H/2+4,Math.min(46,W/18),'#f0e0d0','center','Georgia,serif');
  cx.fillStyle='#7a1a14';cx.fillRect(W/2-80,H/2+20,160,2);
  txt(D.sub,W/2,H/2+56,18,'#a89888','center','Georgia,serif','italic');cx.globalAlpha=1;
}
function drawTitle(){
  drawBG('ruins',0);
  cx.save();cx.translate(-Math.round(cam.x),0);drawProps('ruins',0);
  const px=cam.x+W*.28;drawHuman({x:px+90,y:GY,face:1,sc:.62,t:time,wk:1,col:COL.child,sp:13});drawHuman({x:px,y:GY,face:1,sc:1,t:time,wk:1,col:COL.father,weapon:'axe'});
  cx.restore();
  const v=cx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.62);v.addColorStop(0,'rgba(0,0,0,.1)');v.addColorStop(1,'rgba(0,0,0,.75)');cx.fillStyle=v;cx.fillRect(0,0,W,H);
  txt('THE DARK SAGA',W/2,128,Math.min(64,W/13),'#d02a20','center','Georgia,serif');
  txt('BLOOD & VENGEANCE',W/2,170,Math.min(26,W/36),'#e8d8c8','center','Georgia,serif');
  txt('PART 1  -  RAMSETU KA SAFAR',W/2,200,15,'#a88878','center');
  if(!selMode){
    const bw=260,bx=W/2-bw/2;let by=236;
    btn('NEW GAME',bx,by,bw,50,()=>{tryFS();loadChapter(0)},true);by+=62;
    const pr=loadProg();if(pr>0&&pr<CH.length){btn('CONTINUE - Chapter '+(pr+1),bx,by,bw,50,()=>{tryFS();loadChapter(pr)});by+=62}
    btn('CHAPTERS',bx,by,bw,50,()=>{selMode=true});by+=62;
    btn(muted?'SOUND: OFF':'SOUND: ON',bx,by,bw,40,()=>{setMute(!muted)});
  }else{
    const bw=270,bh=46;for(let i=0;i<CH.length;i++){const cc=i%2,rw=Math.floor(i/2);btn((i+1)+'. '+CH[i].title,W/2-bw-8+cc*(bw+16),226+rw*56,bw,bh,()=>{tryFS();selMode=false;loadChapter(i)},false)}
    btn('< BACK',W/2-80,226+3*56+8,160,40,()=>{selMode=false});
  }
}
function drawEnd(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  txt('PART 1 COMPLETE',W/2,H/2-70,Math.min(50,W/15),'#d02a20','center','Georgia,serif');
  txt('Beti Ramsetu ke safe base tak pahunch gayi... par kahani abhi khatam nahi hui.',W/2,H/2-24,18,'#e8d8c8','center','Georgia,serif','italic');
  txt('PART 2: THE CEMETERY OF THE DAMNED',W/2,H/2+20,24,'#c9a090','center','Georgia,serif');
  txt('Jaldi aa raha hai...',W/2,H/2+52,16,'#887060','center');
  btn('MAIN MENU',W/2-110,H/2+84,220,48,()=>{state='title';selMode=false},true);
}
function drawOver(){
  cx.fillStyle='rgba(0,0,0,'+clamp(goT*.8,0,.7)+')';cx.fillRect(0,0,W,H);
  if(goT>.8){txt('TUM HAAR GAYE',W/2,H/2-40,Math.min(54,W/14),'#d02a20','center','Georgia,serif');
    btn('RETRY',W/2-110,H/2-6,220,48,()=>{loadChapter(chIdx,cp)},true);btn('MAIN MENU',W/2-110,H/2+54,220,44,()=>{state='title'})}
}
function drawPause(){
  cx.fillStyle='rgba(0,0,0,.65)';cx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2-92,40,'#e8d8c8','center','Georgia,serif');
  btn('RESUME',W/2-120,H/2-66,240,46,()=>{state='play'},true);
  btn('RESTART CHECKPOINT',W/2-120,H/2-10,240,44,()=>{loadChapter(chIdx,cp)});
  btn(muted?'SOUND: OFF':'SOUND: ON',W/2-120,H/2+44,240,44,()=>{setMute(!muted)});
  btn('MAIN MENU',W/2-120,H/2+98,240,44,()=>{state='title'});
}
function tryFS(){try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{})}}catch(e){}}
function draw(){
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
  if(IH>IW){cx.setTransform(DPR,0,0,DPR,0,0);cx.textAlign='center';cx.fillStyle='#e8d8c8';cx.font='bold 22px system-ui,sans-serif';cx.fillText('Phone / tablet ko landscape mein ghumao',IW/2,IH/2);cx.font='15px system-ui,sans-serif';cx.fillStyle='#887060';cx.fillText('(aadha ghumake horizontal rakho)',IW/2,IH/2+30);return}
  cx.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();ui.length=0;
  switch(state){
    case'title':drawTitle();break;
    case'card':drawCard();break;
    case'play':drawWorld();drawHUD();break;
    case'pause':drawWorld();drawHUD();drawPause();break;
    case'over':drawWorld();drawOver();break;
    case'cut':drawWorld();if(CUT)drawCutUI();break;
    case'end':drawEnd();break;
  }
  cx.restore();
}

/* ---------- loop ---------- */
let last=performance.now();
function step(dt){update(dt);draw()}
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;step(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__G={step,loadChapter,keys,edge,CH,get state(){return state},set state(v){state=v},get P(){return P},get enemies(){return enemies},get L(){return L},get CUT(){return CUT},cutAdvance,get ally(){return ally},get banner(){return banner},nextChapter};
const qs=(location.search.match(/ch=(\d)/)||[])[1];if(qs&&CH[+qs-1]){loadChapter(+qs-1)}
})();
</script>
